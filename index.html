<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashish Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">

        <!-- DISPLAY -->
        <div class="display">
            <div class="display-top">
                <span class="display-moon">☾</span>
            </div>
            <div class="display-divider"></div>
            <div id="result" class="result">0</div>
            <div id="expression" class="expression"></div>
        </div>

        <!-- THEME SWITCH -->
        <div class="theme-switch">
            <label class="switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider">
                    <span class="toggle-dot"></span>
                </span>
            </label>
            <span class="mode-label">Night mode ☾</span>
        </div>

        <!-- BUTTON GRID -->
        <div class="buttons">
            <button class="btn ac-btn">AC</button>
            <button class="btn operator">÷</button>
            <button class="btn operator">×</button>
            <button class="btn operator">-</button>

            <button class="btn number">7</button>
            <button class="btn number">8</button>
            <button class="btn number">9</button>
            <button class="btn operator">+</button>

            <button class="btn number">4</button>
            <button class="btn number">5</button>
            <button class="btn number">6</button>
            <button class="btn equal-btn">=</button>

            <button class="btn number">1</button>
            <button class="btn number">2</button>
            <button class="btn number">3</button>

            <button class="btn zero number">0</button>
        </div>
    </div>
<div class="credits">
    Designed & Developed by <strong>Kashish Dhanani</strong> © 2025
</div>

    <script src="script.js"></script>
</body>
</html>
